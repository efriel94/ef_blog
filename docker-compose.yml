# docker run --name blog --rm --volume=$PWD:/srv/jekyll -p 4000:4000 -it jekyll/jekyll:4.0 jekyll serve
---
services:
    blog:
        image: jekyll/jekyll:4.0
        volumes:
            - '.:/srv/jekyll'
        ports: 
            - 4000:4000
        command: bash -c "jekyll build && jekyll serve"
